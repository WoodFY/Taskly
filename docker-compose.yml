version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: taskly-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskly-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskly-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/taskly
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskly-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskly-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - taskly-network

volumes:
  mongodb_data:

networks:
  taskly-network:
    driver: bridge
